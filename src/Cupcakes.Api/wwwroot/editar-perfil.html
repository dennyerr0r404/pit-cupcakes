<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar meus dados · Cupcakes Gourmet</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <main>
    <form id="formDados" novalidate>
      <h2 class="titulo-secao">Meus dados</h2>
      <div id="alertaDados"></div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" disabled>
        <div class="dica">O e-mail é usado para entrar e não pode ser alterado.</div>
      </div>
      <div class="campo" data-campo="nome">
        <label for="nome">Nome completo *</label>
        <input id="nome" name="nome" autocomplete="name" maxlength="120" required>
        <div class="erro"></div>
      </div>
      <div class="campo" data-campo="telefone">
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" autocomplete="tel" maxlength="20" placeholder="(11) 98888-7777">
        <div class="dica">Opcional. Com DDD: celular ou fixo.</div>
        <div class="erro"></div>
      </div>
      <button class="btn" type="submit">Salvar dados</button>
    </form>

    <form id="formSenha" novalidate style="margin-top:28px">
      <h2 class="titulo-secao">Trocar senha</h2>
      <div id="alertaSenha"></div>
      <div class="campo" data-campo="senhaAtual">
        <label for="atual">Senha atual *</label>
        <input id="atual" name="atual" type="password" autocomplete="current-password" required>
        <div class="erro"></div>
      </div>
      <div class="campo" data-campo="novaSenha">
        <label for="nova">Nova senha *</label>
        <input id="nova" name="nova" type="password" autocomplete="new-password" minlength="6" required>
        <div class="dica">Mínimo de 6 caracteres.</div>
        <div class="erro"></div>
      </div>
      <div class="campo" data-campo="confirmacao">
        <label for="confirmacao">Confirme a nova senha *</label>
        <input id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" required>
        <div class="erro"></div>
      </div>
      <button class="btn sec" type="submit">Trocar senha</button>
    </form>
  </main>
</div>
<script src="js/core.js"></script>
<script>
(async () => {
  // Laudo, item 4: o cliente edita nome, telefone e senha.
  if (!Sessao.exigir()) return;
  montarLayout({ titulo: "Editar meus dados", voltar: "perfil.html", nav: "perfil" });
  const fd = $("#formDados"), fs = $("#formSenha");
  mascaraTelefone(fd.telefone);

  try {
    const u = await api("auth/me");          // dados atuais do servidor
    Sessao.salvar({ usuario: u });
    $("#email").value = u.email;
    fd.nome.value = u.nome;
    fd.telefone.value = u.telefone || "";
  } catch (e) {
    if (e.status === 401) { Sessao.irParaLogin(); return; }
    $("#alertaDados").innerHTML = telaErro(e);
  }

  fd.addEventListener("submit", async e => {
    e.preventDefault();
    limparErros(fd); $("#alertaDados").innerHTML = "";
    const corpo = { nome: fd.nome.value.trim(), telefone: fd.telefone.value.trim() || null };
    let ok = true;
    if (corpo.nome.length < 2) { marcarCampo(fd, "nome", "Informe seu nome."); ok = false; }
    if (!telefoneValido(corpo.telefone)) { marcarCampo(fd, "telefone", "Informe o telefone com DDD, ex.: (11) 98888-7777."); ok = false; }
    if (!ok) return;
    const b = $("button[type=submit]", fd); b.disabled = true;
    try {
      const r = await api("auth/perfil", { metodo: "PUT", corpo });
      Sessao.salvar(r);
      fd.telefone.value = r.usuario.telefone || "";
      $("#alertaDados").innerHTML = '<div class="aviso ok" role="status">✓ Dados atualizados.</div>';
    } catch (err) {
      if (err.status === 401) { Sessao.irParaLogin(); return; }
      if (!mostrarErros(fd, err)) $("#alertaDados").innerHTML = `<div class="aviso erro" role="alert">${esc(err.message)}</div>`;
    } finally { b.disabled = false; }
  });

  fs.addEventListener("submit", async e => {
    e.preventDefault();
    limparErros(fs); $("#alertaSenha").innerHTML = "";
    let ok = true;
    if (!fs.atual.value) { marcarCampo(fs, "senhaAtual", "Informe a senha atual."); ok = false; }
    if (fs.nova.value.length < 6) { marcarCampo(fs, "novaSenha", "A nova senha deve ter pelo menos 6 caracteres."); ok = false; }
    if (fs.confirmacao.value !== fs.nova.value) { marcarCampo(fs, "confirmacao", "As senhas não conferem."); ok = false; }
    if (!ok) return;
    const b = $("button[type=submit]", fs); b.disabled = true;
    try {
      await api("auth/senha", { metodo: "POST", corpo: { senhaAtual: fs.atual.value, novaSenha: fs.nova.value } });
      fs.reset();
      $("#alertaSenha").innerHTML = '<div class="aviso ok" role="status">✓ Senha alterada.</div>';
    } catch (err) {
      if (err.status === 401) { Sessao.irParaLogin(); return; }
      if (!mostrarErros(fs, err)) $("#alertaSenha").innerHTML = `<div class="aviso erro" role="alert">${esc(err.message)}</div>`;
    } finally { b.disabled = false; }
  });
})();
</script>
</body>
</html>
