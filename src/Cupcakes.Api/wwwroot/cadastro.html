<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro · Cupcakes Gourmet</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <main>
    <form id="form" novalidate>
      <div id="alerta"></div>
      <div class="campo" data-campo="nome">
        <label for="nome">Nome completo *</label>
        <input id="nome" name="nome" autocomplete="name" maxlength="120" required>
        <div class="erro"></div>
      </div>
      <div class="campo" data-campo="email">
        <label for="email">E-mail *</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="180" required>
        <div class="erro"></div>
      </div>
      <div class="campo" data-campo="telefone">
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" autocomplete="tel" maxlength="20" placeholder="(11) 99999-0000">
        <div class="erro"></div>
      </div>
      <div class="campo" data-campo="senha">
        <label for="senha">Senha *</label>
        <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="6" maxlength="72" required>
        <div class="dica">Mínimo de 6 caracteres.</div>
        <div class="erro"></div>
      </div>
      <div class="campo" data-campo="confirmacao">
        <label for="confirmacao">Confirme a senha *</label>
        <input id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" required>
        <div class="erro"></div>
      </div>
      <button class="btn" type="submit">Criar conta</button>
      <p class="form-rodape">Já tem conta? <a class="link" id="linkLogin" href="login.html">Entrar</a></p>
    </form>
  </main>
</div>
<script src="js/core.js"></script>
<script>
  montarLayout({ titulo: "Criar conta", voltar: true, nav: "perfil" });
  const voltar = params.get("voltar");
  const destino = voltar && /^[a-z0-9_-]+\.html/i.test(voltar) ? voltar : "index.html";
  if (voltar) $("#linkLogin").href = "login.html?voltar=" + encodeURIComponent(voltar);

  $("#form").addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target; limparErros(f); $("#alerta").innerHTML = "";
    const d = { nome: f.nome.value.trim(), email: f.email.value.trim(), telefone: f.telefone.value.trim() || null, senha: f.senha.value };
    let ok = true;
    if (d.nome.length < 2) { marcarCampo(f, "nome", "Informe seu nome."); ok = false; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)) { marcarCampo(f, "email", "Informe um e-mail válido."); ok = false; }
    if (d.senha.length < 6) { marcarCampo(f, "senha", "A senha deve ter pelo menos 6 caracteres."); ok = false; }
    if (f.confirmacao.value !== d.senha) { marcarCampo(f, "confirmacao", "As senhas não conferem."); ok = false; }
    if (!ok) return;
    const b = $("button[type=submit]", f); b.disabled = true; b.textContent = "Criando conta…";
    try {
      Sessao.salvar(await api("auth/cadastro", { metodo: "POST", corpo: d }));
      location.replace(destino);
    } catch (err) {
      if (err.status === 409) marcarCampo(f, "email", err.message);
      else if (!mostrarErros(f, err)) $("#alerta").innerHTML = `<div class="aviso erro" role="alert">${esc(err.message)}</div>`;
      b.disabled = false; b.textContent = "Criar conta";
    }
  });
</script>
</body>
</html>
