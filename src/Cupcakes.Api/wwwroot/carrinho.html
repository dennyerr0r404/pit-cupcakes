<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrinho · Cupcakes Gourmet</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <main id="conteudo"><div class="carregando">Carregando…</div></main>
</div>
<script src="js/core.js"></script>
<script>
(async () => {
  montarLayout({ titulo: "Carrinho", voltar: "index.html", nav: "carrinho" });
  const el = $("#conteudo");
  let produtos = {};

  try {
    (await api("produtos")).forEach(p => produtos[p.id] = p);
  } catch (e) { el.innerHTML = telaErro(e); return; }

  // Produtos que saíram do catálogo são retirados do carrinho.
  const removidos = Carrinho.itens().filter(i => !produtos[i.id]);
  removidos.forEach(i => Carrinho.remover(i.id));
  // Quantidades acima do estoque são ajustadas.
  let ajustados = 0;
  Carrinho.itens().forEach(i => {
    const est = produtos[i.id].quantidadeEstoque;
    if (i.qtd > est) { Carrinho.definir(i.id, est); ajustados++; }
  });

  function render() {
    const itens = Carrinho.itens();
    if (!itens.length) {
      el.innerHTML = telaVazia("Seu carrinho está vazio.", "Ver cupcakes", "index.html");
      return;
    }
    const total = itens.reduce((s, i) => s + produtos[i.id].preco * i.qtd, 0);
    const qtdTotal = itens.reduce((s, i) => s + i.qtd, 0);
    el.innerHTML = `
      ${removidos.length ? `<div class="aviso erro" role="alert">${removidos.length} item(ns) indisponível(is) foram retirados do carrinho.</div>` : ""}
      ${ajustados ? `<div class="aviso erro" role="alert">Algumas quantidades foram ajustadas ao estoque disponível.</div>` : ""}
      ${itens.map(i => { const p = produtos[i.id]; return `
        <div class="item">
          <a class="img" href="produto.html?id=${p.id}">${imagemProduto(p)}</a>
          <div class="info">
            <div class="l1"><span>${esc(p.nome)}</span>
              <button class="remover" type="button" data-remover="${p.id}" aria-label="Remover ${esc(p.nome)}">✕</button></div>
            <div class="l2"><span>${moeda(p.preco)} cada</span>
              <div class="qtd">
                <button type="button" data-menos="${p.id}" ${i.qtd <= 1 ? "disabled" : ""} aria-label="Diminuir ${esc(p.nome)}">−</button>
                <output>${i.qtd}</output>
                <button type="button" data-mais="${p.id}" ${i.qtd >= p.quantidadeEstoque ? "disabled" : ""} aria-label="Aumentar ${esc(p.nome)}">+</button>
              </div></div>
            <div class="l2"><span>Subtotal</span><b>${moeda(p.preco * i.qtd)}</b></div>
          </div>
        </div>`; }).join("")}
      <div class="resumo">
        <div><span>Itens (${qtdTotal})</span><span>${moeda(total)}</span></div>
        <div class="total"><span>Total</span><span>${moeda(total)}</span></div>
      </div>
      <p class="nota" style="margin:8px 0 14px">O valor final é conferido pelo sistema ao confirmar o pedido.</p>
      <a class="btn" href="finalizar.html">Continuar</a>`;
  }

  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const id = Number(b.dataset.remover || b.dataset.menos || b.dataset.mais);
    if (b.dataset.remover) { Carrinho.remover(id); toast("Item removido"); }
    else if (b.dataset.menos) Carrinho.definir(id, Carrinho.qtdDe(id) - 1);
    else if (b.dataset.mais) Carrinho.definir(id, Math.min(Carrinho.qtdDe(id) + 1, produtos[id].quantidadeEstoque));
    removidos.length = 0; ajustados = 0;
    render();
  });
  render();
})();
</script>
</body>
</html>
